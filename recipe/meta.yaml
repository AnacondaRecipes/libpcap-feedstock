{% set name = "libpcap" %}
{% set version = "1.11.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://www.tcpdump.org/release/{{ name }}-{{ version }}.tar.gz
  sha256: 596389bc8560ea027dff9db8aaf6c173d992366d9aef4baf5d7c6d180b4d49ad
  patches:
    - fix-install.patch  # [osx]

build:
  number: 0
  skip: true  # [win]
  run_exports:
    # https://abi-laboratory.pro/?view=timeline&l=libpcap
    # Symbol removal at minor bump
    - {{ pin_subpackage('libpcap', max_pin='x.x') }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - flex
    - bison
    - m4
    - make
    - libtool

test:
  commands:
    - test -f $PREFIX/lib/libpcap.so      # [linux]
    - test -f $PREFIX/lib/libpcap.dylib   # [osx]
    - test -f $PREFIX/include/pcap.h      # [unix]

about:
  home: https://www.tcpdump.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: 'the LIBpcap interface to various kernel packet capture mechanism'
  description: |
    System-independent interface for user-level packet capture.
    libpcap provides a portable framework for low-level network monitoring
  doc_url: https://www.tcpdump.org/#documentation
  dev_url: https://github.com/the-tcpdump-group/libpcap

extra:
  recipe-maintainers:
    - nehaljwani
